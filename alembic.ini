# Database migrations (Alembic). Run these from the project root:
#
#   alembic upgrade head                               apply pending migrations (the API also does this on startup)
#   alembic revision --autogenerate -m "what changed"  write a migration after you change a model
#   alembic history                                    list migrations
#
# The database URL comes from DATABASE_URL (see backend/config.py), not from this file.

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Keep generated migrations lint-clean (ruff is in requirements-dev.txt).
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
