# Settings come from a .env file next to this one (see .env.example).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      # Leave SECRET_KEY empty and sign-ins reset whenever the container restarts.
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/db/baseball.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      # Read by uvicorn: which proxy IPs may set X-Forwarded-For.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - baseball_db:/app/db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  baseball_db:
